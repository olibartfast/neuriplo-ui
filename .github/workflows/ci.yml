name: CI

# Runs exactly the gates Phase 5 defines: build, unit tests, and the browser
# matrix against the fixture producer. Linting, formatting, and packaging are
# Phase 7's, and are deliberately not run here yet.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      # The E2E suite supplies its own producer, so the runner needs a browser
      # and nothing else: no models, no weights, no compiled neuriplo-infer.
      - run: npm --workspace @neuriplo-ui/e2e exec -- playwright install --with-deps chromium

      - run: npm run test:e2e

      # A failure has to be diagnosable from what it left behind.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
