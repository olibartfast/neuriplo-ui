name: CI

# `checks` is seconds of work, so a formatting slip or
# a type error should not be reported eight minutes later from behind a browser
# matrix — and a style failure should not stop the E2E suite telling us whether
# the product still works.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. Reports rather than
      # rewrites: CI is a gate, and a gate that edits the branch is not one.
      - run: npm run lint

      # Covers the E2E harness and the adapter's tests, which nothing compiles
      # and which Playwright and tsx both run by stripping types unchecked.
      - run: npm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # The E2E suite supplies its own producer, so the runner needs a browser
      # and nothing else: no models, no weights, no compiled neuriplo-infer.
      - run: npm --workspace @neuriplo-ui/e2e exec -- playwright install --with-deps chromium

      - run: npm run test:e2e

      # A failure has to be diagnosable from what it left behind.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  installer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install the complete CPU Docker profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash install.sh --style docker --backend onnx_runtime \
            --prefix "$RUNNER_TEMP/neuriplo-installed" \
            --data-dir "$RUNNER_TEMP/neuriplo-workspace" --port 5373
      - name: Start and inspect the installed application
        run: |
          "$RUNNER_TEMP/neuriplo-installed/neuriplo-ui-docker" > "$RUNNER_TEMP/installed-ui.log" 2>&1 &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5373/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5373/ | grep -q '<div id="root">'
          curl --fail --silent http://127.0.0.1:5373/api/capabilities > "$RUNNER_TEMP/installed-capabilities.json"
          python3 - "$RUNNER_TEMP/installed-capabilities.json" <<'PY'
          import json, sys
          caps = json.load(open(sys.argv[1]))
          assert caps['schema_version'] == 2
          assert 'onnx_runtime' in next(w for w in caps['execution']['workflows'] if w['id'] == 'local')['backends']
          PY
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: installer-diagnostics
          path: |
            ${{ runner.temp }}/installed-ui.log
            ${{ runner.temp }}/installed-capabilities.json
